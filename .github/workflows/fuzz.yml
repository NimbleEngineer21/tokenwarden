name: fuzz

on:
  pull_request:
    paths:
      - "internal/anthropic/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "internal/anthropic/**"
  # Longer runs find what a short PR run misses.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzReader, FuzzRoundTrip]
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '30s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: fuzz
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime="$FUZZTIME" ./internal/anthropic/
      # A failing input is written to testdata/fuzz; keep it so that it can be
      # added to the seed corpus.
      - name: upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/anthropic/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 14
